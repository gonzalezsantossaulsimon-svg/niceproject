<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodo académico</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body class="w3-light-grey">
  <nav class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large">NiceProject</span>
    <a href="periodos.html" class="w3-bar-item w3-button w3-right">Volver</a>
  </nav>
  <main class="w3-container w3-padding-16">
    <h1 id="titulo" class="w3-text-indigo">Nuevo periodo</h1>
    <form id="formulario" class="w3-card-4 w3-white w3-padding-16" style="max-width:700px;">
      <label for="clave"><b>Clave *</b></label>
      <input id="clave" class="w3-input w3-border" required>
      <label class="w3-margin-top" for="nombre"><b>Nombre *</b></label>
      <input id="nombre" class="w3-input w3-border" required>
      <label class="w3-margin-top" for="fechaInicio"><b>Fecha inicio</b></label>
      <input id="fechaInicio" type="date" class="w3-input w3-border">
      <label class="w3-margin-top" for="fechaFin"><b>Fecha fin</b></label>
      <input id="fechaFin" type="date" class="w3-input w3-border">
      <label class="w3-margin-top" for="estado"><b>Estado</b></label>
      <select id="estado" class="w3-select w3-border">
        <option value="BORRADOR">BORRADOR</option>
        <option value="VALIDADO">VALIDADO</option>
        <option value="CERRADO">CERRADO</option>
      </select>
      <div id="mensaje" class="w3-panel w3-pale-red w3-margin-top" style="display:none;"></div>
      <div class="w3-margin-top">
        <button id="guardar" type="submit" class="w3-button w3-green w3-round">Guardar</button>
        <a href="periodos.html" class="w3-button w3-grey w3-round">Cancelar</a>
      </div>
    </form>
  </main>
  <script type="module" src="./js/periodo-form.js"></script>
</body>
</html>
