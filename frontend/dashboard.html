<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">

  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="dashboard.html" class="w3-bar-item w3-button w3-right">Inicio</a>
    <a href="profesores.html" class="w3-bar-item w3-button w3-right">Profesores</a>
    <a href="academias.html" class="w3-bar-item w3-button w3-right">Academias</a>
    <a href="#" id="logout" class="w3-bar-item w3-button w3-right">Salir</a>
  </div>

  <div class="w3-container w3-padding-32">
    <h1 class="w3-center w3-text-indigo">Panel de Administración</h1>
    <p class="w3-center w3-text-grey" id="bienvenida"></p>

    <div class="w3-row-padding w3-margin-top">
      <div class="w3-third">
        <div class="w3-card-4 w3-white w3-padding-16 w3-center w3-hover-shadow">
          <i class="fa fa-users w3-xxxlarge w3-text-indigo"></i>
          <h3>Profesores</h3>
          <p>Gestiona la plantilla docente</p>
          <a href="profesores.html" class="w3-btn w3-indigo w3-round">Entrar</a>
        </div>
      </div>
      <div class="w3-third">
        <div class="w3-card-4 w3-white w3-padding-16 w3-center w3-hover-shadow">
          <i class="fa fa-building w3-xxxlarge w3-text-indigo"></i>
          <h3>Academias</h3>
          <p>Administra las academias</p>
          <a href="academias.html" class="w3-btn w3-indigo w3-round">Entrar</a>
        </div>
      </div>
      <div class="w3-third">
        <div class="w3-card-4 w3-white w3-padding-16 w3-center w3-hover-shadow">
          <i class="fa fa-check-circle w3-xxxlarge w3-text-indigo"></i>
          <h3>Coincidencias</h3>
          <p>Materias afines por academia</p>
          <a href="profesores.html" class="w3-btn w3-indigo w3-round">Ver</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requiereSesion, cerrarSesion } from './js/auth.js';
    const user = requiereSesion();
    if (user) {
      document.getElementById('bienvenida').textContent = `Bienvenido, ${user.nombre}`;
    }
    document.getElementById('logout').addEventListener('click', (e) => {
      e.preventDefault();
      cerrarSesion();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
