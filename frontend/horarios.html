<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario general</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="dashboard.html" class="w3-bar-item w3-button w3-right">Inicio</a>
    <a href="cursos.html" class="w3-bar-item w3-button w3-right">Cursos</a>
    <a href="profesores.html" class="w3-bar-item w3-button w3-right">Profesores</a>
    <a href="materias.html" class="w3-bar-item w3-button w3-right">Materias</a>
    <a href="grupos.html" class="w3-bar-item w3-button w3-right">Grupos</a>
    <a href="salones.html" class="w3-bar-item w3-button w3-right">Salones</a>
    <a href="academias.html" class="w3-bar-item w3-button w3-right">Academias</a>
    <a href="evaluaciones.html" class="w3-bar-item w3-button w3-right">Evaluaciones</a>
  </div>

  <main class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo">Horario general</h1>
    <p>Consulta las asignaciones creadas manualmente en <a href="cursos.html">Cursos</a>.</p>

    <section class="w3-card-4 w3-white w3-margin-top w3-padding-16" aria-label="Filtros de horario">
      <div class="w3-row-padding">
        <div class="w3-col l3 m6 w3-margin-bottom">
          <label for="filtroProfesor"><b>Profesor</b></label>
          <select class="w3-select w3-border" id="filtroProfesor">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="w3-col l2 m6 w3-margin-bottom">
          <label for="filtroDia"><b>Día</b></label>
          <select class="w3-select w3-border" id="filtroDia">
            <option value="">Todos</option>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
          </select>
        </div>
        <div class="w3-col l2 m6 w3-margin-bottom">
          <label for="filtroMateria"><b>Materia</b></label>
          <input class="w3-input w3-border" id="filtroMateria" type="search" placeholder="Materia">
        </div>
        <div class="w3-col l2 m6 w3-margin-bottom">
          <label for="filtroSalon"><b>Salón</b></label>
          <input class="w3-input w3-border" id="filtroSalon" type="search" placeholder="Salón">
        </div>
        <div class="w3-col l3 m6 w3-margin-bottom">
          <label for="filtroGrupo"><b>Grupo</b></label>
          <input class="w3-input w3-border" id="filtroGrupo" type="search" placeholder="Grupo">
        </div>
      </div>
      <p class="w3-container w3-text-grey" id="contador" aria-live="polite">Cargando cursos...</p>
    </section>

    <div id="msg" class="w3-panel w3-pale-red w3-border w3-border-red w3-margin-top"
      style="display:none;" role="alert"></div>

    <div class="w3-margin-top">
      <button type="button" class="w3-btn w3-indigo w3-round" id="btnTabla">Vista tabla</button>
      <button type="button" class="w3-btn w3-white w3-border w3-round" id="btnSemanal">Vista semanal</button>
    </div>

    <section id="vistaTabla" class="w3-card-4 w3-white w3-margin-top w3-padding-16"
      aria-label="Horario en tabla">
      <table class="w3-table-all w3-hoverable">
        <thead>
          <tr class="w3-indigo">
            <th>Día</th>
            <th>Hora</th>
            <th>Materia</th>
            <th>Profesor</th>
            <th>Grupo</th>
            <th>Salón</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>

    <section id="vistaSemanal" class="w3-card-4 w3-white w3-margin-top w3-padding-16"
      aria-label="Horario semanal" style="display:none;">
      <div id="semana" class="w3-row-padding"></div>
    </section>
  </main>

  <script type="module" src="./js/horario-general.js"></script>
</body>
</html>
