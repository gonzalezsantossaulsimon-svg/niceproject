<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Profesor</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">

  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large">
      <i class="fa fa-graduation-cap"></i> NiceProject
    </span>
    <a href="profesores.html" class="w3-bar-item w3-button w3-right">Volver</a>
  </div>

  <div class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo" id="titulo">Nuevo Profesor</h1>

    <div class="w3-card-4 w3-white w3-padding-16 w3-margin-top" style="max-width:800px;">
      <form id="form" class="w3-container" novalidate>

        <div class="w3-row-padding">
          <div class="w3-half">
            <label class="w3-text-indigo"><b>Número de empleado *</b></label>
            <input class="w3-input w3-border" id="numeroEmpleado" type="text" maxlength="6"
              placeholder="Ejemplo: EMP001" autocomplete="off" required>
            <small class="w3-text-grey">Formato requerido: EMP seguido de 3 números.</small>
          </div>

          <div class="w3-half">
            <label class="w3-text-indigo"><b>Academia *</b></label>
            <select class="w3-select w3-border" id="academiaId" required>
              <option value="">Cargando academias...</option>
            </select>
          </div>
        </div>

        <div class="w3-row-padding w3-margin-top">
          <div class="w3-half">
            <label class="w3-text-indigo"><b>Nombre *</b></label>
            <input class="w3-input w3-border" id="nombre" type="text" maxlength="80" required>
          </div>

          <div class="w3-half">
            <label class="w3-text-indigo"><b>Apellido *</b></label>
            <input class="w3-input w3-border" id="apellido" type="text" maxlength="100" required>
          </div>
        </div>

        <label class="w3-text-indigo w3-margin-top"><b>Especialidad</b></label>
        <input class="w3-input w3-border" id="especialidad" type="text" maxlength="120">

        <div class="w3-row-padding w3-margin-top">
          <div class="w3-third">
            <label class="w3-text-indigo"><b>Licenciatura</b></label>
            <input class="w3-input w3-border" id="licenciatura" type="text" maxlength="150">
          </div>

          <div class="w3-third">
            <label class="w3-text-indigo"><b>Maestría</b></label>
            <input class="w3-input w3-border" id="maestria" type="text" maxlength="150">
          </div>

          <div class="w3-third">
            <label class="w3-text-indigo"><b>Doctorado</b></label>
            <input class="w3-input w3-border" id="doctorado" type="text" maxlength="150">
          </div>
        </div>

        <div class="w3-row-padding w3-margin-top">
          <div class="w3-half">
            <label class="w3-text-indigo"><b>SNI</b></label>
            <select class="w3-select w3-border" id="sni">
              <option value="Ninguno">Ninguno</option>
              <option value="Candidato">Candidato</option>
              <option value="Nivel 1">Nivel 1</option>
              <option value="Nivel 2">Nivel 2</option>
              <option value="Nivel 3">Nivel 3</option>
            </select>
          </div>

          <div class="w3-half">
            <label class="w3-text-indigo w3-block"><b>Perfil PRODEP</b></label>
            <input class="w3-check" type="checkbox" id="perfilPRODEP">
            <label for="perfilPRODEP">Cuenta con perfil PRODEP</label>
          </div>
        </div>

        <label class="w3-text-indigo w3-margin-top" for="maxHorasSemanales"><b>Carga máxima semanal</b></label>
        <input class="w3-input w3-border" id="maxHorasSemanales" type="number" min="0" value="20">
        <p class="w3-text-grey" id="cargaActualTexto">Carga actual: calculada desde los cursos</p>

        <fieldset class="w3-border w3-padding w3-margin-top">
          <legend><b>Calificaciones por materia</b></legend>
          <div id="calificacionesMateria"></div>
        </fieldset>

        <fieldset class="w3-border w3-padding w3-margin-top">
          <legend><b>Disponibilidad semanal</b></legend>
          <div id="disponibilidadProfesor"></div>
        </fieldset>

        <hr>

        <button type="submit" class="w3-btn w3-green w3-round" id="btnGuardar" disabled>
          <i class="fa fa-save"></i> Guardar
        </button>

        <a href="profesores.html" class="w3-btn w3-grey w3-round">Cancelar</a>

        <div id="msg"
          class="w3-panel w3-pale-red w3-border w3-border-red w3-margin-top"
          style="display:none;"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { getAcademias, getProfesor, crearProfesor, actualizarProfesor } from './js/api.js';
    import { requiereSesion } from './js/auth.js';

    requiereSesion();

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btnGuardar = document.getElementById('btnGuardar');
    const numeroEmpleado = document.getElementById('numeroEmpleado');

    function mostrarError(mensaje) {
      msg.textContent = mensaje;
      msg.style.display = 'block';
      msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function limpiarError() {
      msg.textContent = '';
      msg.style.display = 'none';
    }

    numeroEmpleado.addEventListener('input', () => {
      numeroEmpleado.value = numeroEmpleado.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 6);
    });

    async function cargarAcademias() {
      const academias = await getAcademias();
      if (!Array.isArray(academias)) {
        throw new Error('La respuesta de academias no es válida.');
      }

      const select = document.getElementById('academiaId');
      select.replaceChildren();
      const vacio = document.createElement('option');
      vacio.value = '';
      vacio.textContent = '-- Selecciona --';
      select.appendChild(vacio);

      academias.forEach(academia => {
        const opcion = document.createElement('option');
        opcion.value = academia.clave;
        opcion.textContent = `${academia.clave} — ${academia.nombre}`;
        select.appendChild(opcion);
      });
    }

    async function cargarProfesor() {
      if (!id) return;

      document.getElementById('titulo').textContent = 'Editar Profesor';

      try {
        const p = await getProfesor(id);

        document.getElementById('numeroEmpleado').value = p.numeroEmpleado || '';
        document.getElementById('nombre').value = p.nombre || '';
        document.getElementById('apellido').value = p.apellido || '';
        document.getElementById('especialidad').value = p.especialidad || '';
        document.getElementById('licenciatura').value = p.licenciatura || '';
        document.getElementById('maestria').value = p.maestria || '';
        document.getElementById('doctorado').value = p.doctorado || '';
        document.getElementById('sni').value = p.sni || 'Ninguno';
        document.getElementById('perfilPRODEP').checked = Boolean(p.perfilPRODEP);
        document.getElementById('academiaId').value = p.academiaId || '';
        document.getElementById('maxHorasSemanales').value = String(p.maxHorasSemanales ?? 20);
        document.getElementById('cargaActualTexto').textContent =
          `Carga actual: ${p.cargaActual ?? 0} horas; Disponibles: ${p.horasDisponibles ?? p.maxHorasSemanales ?? 20}`;
      } catch (err) {
        mostrarError(err.message || 'No fue posible cargar el profesor');
      }
    }

    function validarFormulario(data) {
      if (!/^EMP\d{3}$/.test(data.numeroEmpleado)) {
        return 'El número de empleado debe tener el formato EMP001.';
      }

      if (!data.nombre) {
        return 'El nombre es obligatorio.';
      }

      if (!data.apellido) {
        return 'El apellido es obligatorio.';
      }

      if (!data.academiaId) {
        return 'Debes seleccionar una academia.';
      }

      return null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limpiarError();

      const data = {
        numeroEmpleado: numeroEmpleado.value.trim().toUpperCase(),
        nombre: document.getElementById('nombre').value.trim(),
        apellido: document.getElementById('apellido').value.trim(),
        especialidad: document.getElementById('especialidad').value.trim(),
        licenciatura: document.getElementById('licenciatura').value.trim(),
        maestria: document.getElementById('maestria').value.trim(),
        doctorado: document.getElementById('doctorado').value.trim(),
        sni: document.getElementById('sni').value,
        perfilPRODEP: document.getElementById('perfilPRODEP').checked,
        academiaId: document.getElementById('academiaId').value,
        maxHorasSemanales: Number(document.getElementById('maxHorasSemanales').value)
      };

      const error = validarFormulario(data);

      if (error) {
        mostrarError(error);
        return;
      }

      btnGuardar.disabled = true;
      btnGuardar.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Guardando...';

      try {
        if (id) {
          await actualizarProfesor(id, data);
          await window.guardarDatosAcademicos?.(id);
        } else {
          await crearProfesor(data);
        }

        window.location.href = 'profesores.html';
      } catch (err) {
        mostrarError(err.message || 'No fue posible guardar el profesor');
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerHTML = '<i class="fa fa-save"></i> Guardar';
      }
    });

    async function inicializarFormulario() {
      try {
        await cargarAcademias();
        await cargarProfesor();
        btnGuardar.disabled = false;
      } catch (error) {
        mostrarError(error.message || 'No fue posible cargar las academias.');
      }
    }

    inicializarFormulario();
  </script>
  <script type="module">
    import {
      getMaterias,
      getProfesor,
      actualizarCalificacionesProfesor,
      actualizarDisponibilidadProfesor,
      eliminarCalificacionProfesor
    } from './js/api.js';
    import { requiereSesion } from './js/auth.js';
    requiereSesion();
    const id = new URLSearchParams(window.location.search).get('id');
    const calificacionesDiv = document.getElementById('calificacionesMateria');
    const disponibilidadDiv = document.getElementById('disponibilidadProfesor');
    if (id) {
      Promise.all([getMaterias(), getProfesor(id)]).then(([materias, profesor]) => {
        const actuales = new Map((profesor.calificaciones || []).map((item) => [String(item.materiaId), item.calificacion]));
        calificacionesDiv.replaceChildren();
        for (const materia of materias) {
          const fila = document.createElement('label');
          fila.className = 'w3-block w3-margin-bottom';
          const texto = document.createElement('span');
          texto.textContent = `${materia.clave} — ${materia.nombre}: `;
          const input = document.createElement('input');
          input.type = 'number';
          input.min = '0';
          input.max = '10';
          input.step = '0.1';
          input.className = 'w3-input w3-border w3-right';
          input.style.maxWidth = '120px';
          input.dataset.materiaId = String(materia.id);
          input.value = actuales.has(String(materia.id)) ? String(actuales.get(String(materia.id))) : '';
          fila.append(texto, input);
          if (actuales.has(String(materia.id))) {
            const quitar = document.createElement('button');
            quitar.type = 'button';
            quitar.className = 'w3-button w3-red w3-round w3-margin-left';
            quitar.textContent = 'Eliminar relación';
            quitar.addEventListener('click', async () => {
              if (!window.confirm(`¿Eliminar la calificación de ${materia.nombre} para este profesor?`)) return;
              try {
                await eliminarCalificacionProfesor(id, materia.id);
                input.value = '';
                quitar.remove();
              } catch (error) {
                mostrarError(error.message);
              }
            });
            fila.append(quitar);
          }
          calificacionesDiv.append(fila);
        }
        disponibilidadDiv.replaceChildren();
        const disponibles = new Map(
          (profesor.disponibilidad || []).map((item) =>
            [`${item.dia}|${item.horaInicio}|${item.horaFin}`, Number(item.disponible) === 1])
        );
        for (const dia of ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']) {
          const bloque = document.createElement('div');
          bloque.className = 'w3-margin-bottom';
          const titulo = document.createElement('b');
          titulo.textContent = `${dia}: `;
          bloque.append(titulo);
          for (const [inicio, fin] of [['07:00','09:00'],['09:00','11:00'],['11:00','13:00'],['08:00','09:00'],['10:00','11:00'],['12:00','13:00']]) {
            const clave = `${dia}|${inicio}|${fin}`;
            if (inicio === '08:00' && dia !== 'Viernes') continue;
            if (inicio === '10:00' && dia !== 'Viernes') continue;
            if (inicio === '12:00' && dia !== 'Viernes') continue;
            const label = document.createElement('label');
            label.className = 'w3-margin-right';
            const check = document.createElement('input');
            check.type = 'checkbox';
            check.className = 'w3-check';
            check.dataset.dia = dia;
            check.dataset.inicio = inicio;
            check.dataset.fin = fin;
            check.checked = disponibles.has(clave) ? disponibles.get(clave) : true;
            const texto = document.createElement('span');
            texto.textContent = ` ${inicio}–${fin}`;
            label.append(check, texto);
            bloque.append(label);
          }
          disponibilidadDiv.append(bloque);
        }
      }).catch((error) => {
        calificacionesDiv.textContent = error.message;
        disponibilidadDiv.textContent = error.message;
      });

      window.guardarDatosAcademicos = async (profesorId) => {
        const calificaciones = Array.from(calificacionesDiv.querySelectorAll('input')).map((input) => ({
          materiaId: Number(input.dataset.materiaId),
          calificacion: Number(input.value)
        })).filter((item, index) => {
          const input = calificacionesDiv.querySelectorAll('input')[index];
          return input.value.trim() !== '' && Number.isFinite(item.calificacion) && inputVisible(item.calificacion);
        });
        const disponibilidad = Array.from(disponibilidadDiv.querySelectorAll('input[type="checkbox"]')).map((check) => ({
          dia: check.dataset.dia,
          horaInicio: check.dataset.inicio,
          horaFin: check.dataset.fin,
          disponible: check.checked
        }));
        try {
          await actualizarCalificacionesProfesor(profesorId, calificaciones);
          await actualizarDisponibilidadProfesor(profesorId, disponibilidad);
        } catch (error) {
          mostrarError(error.message);
          throw error;
        }
      };
    }
    function inputVisible(valor) { return valor >= 0 && valor <= 10; }
  </script>
</body>
</html>
