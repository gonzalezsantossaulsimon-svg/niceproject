<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NiceProject</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">

  <div class="w3-container w3-padding-64 w3-margin-top">
    <div class="w3-card-4 w3-white w3-padding-32" style="max-width:400px; margin:auto;">
      <h2 class="w3-center w3-text-indigo">
        <i class="fa fa-graduation-cap"></i> NiceProject
      </h2>
      <p class="w3-center w3-text-grey">Sistema de Gestión de Profesores</p>
      <hr>

      <form id="loginForm" class="w3-container">
        <label class="w3-text-indigo"><b>Usuario</b></label>
        <input class="w3-input w3-border" type="text" id="username" required>

        <label class="w3-text-indigo w3-margin-top"><b>Contraseña</b></label>
        <input class="w3-input w3-border" type="password" id="password" required>

        <button class="w3-btn w3-indigo w3-block w3-margin-top w3-round" type="submit">
          <i class="fa fa-sign-in"></i> Iniciar sesión
        </button>
      </form>

      <p id="error" class="w3-center w3-text-red w3-margin-top"></p>

      <div class="w3-panel w3-pale-blue w3-leftbar w3-border-blue w3-margin-top">
        <p class="w3-small">Usuario: <b>admin</b> · Contraseña: <b>admin123</b></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { login } from './js/api.js';
    import { guardarSesion } from './js/auth.js';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      try {
        const user = await login(username, password);
        guardarSesion(user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
