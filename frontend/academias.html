<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academias</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">

  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="dashboard.html" class="w3-bar-item w3-button w3-right">Inicio</a>
    <a href="profesores.html" class="w3-bar-item w3-button w3-right">Profesores</a>
    <a href="academias.html" class="w3-bar-item w3-button w3-right">Academias</a>
    <a href="evaluaciones.html" class="w3-bar-item w3-button w3-right">Evaluaciones</a>
  </div>

  <div class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo">Academias</h1>

    <a href="academia-form.html" class="w3-button w3-green w3-round w3-margin-bottom">
      <i class="fa fa-plus"></i> Nueva academia
    </a>

    <div id="msg" class="w3-panel w3-pale-red w3-border w3-border-red"
      style="display:none;" role="alert"></div>

    <div id="lista" class="w3-row-padding"></div>
  </div>

  <script type="module">
    import { getAcademias, eliminarAcademia } from './js/api.js';
    import { requiereSesion } from './js/auth.js';
    requiereSesion();

    const lista = document.getElementById('lista');
    const msg = document.getElementById('msg');

    function mostrarError(mensaje) {
      msg.textContent = mensaje;
      msg.style.display = 'block';
      msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function cargar() {
      try {
        const academias = await getAcademias();
        if (!Array.isArray(academias)) {
          throw new Error('La respuesta de academias no es válida.');
        }

        msg.textContent = '';
        msg.style.display = 'none';
        lista.replaceChildren();
        academias.forEach(a => {
          const clave = String(a.clave || '');
          const col = document.createElement('div');
          col.className = 'w3-third w3-margin-bottom';

          const tarjeta = document.createElement('div');
          tarjeta.className = 'w3-card-4 w3-white w3-padding-16';

          const nombre = document.createElement('h3');
          nombre.className = 'w3-text-indigo';
          nombre.textContent = a.nombre || '';

          const claveTexto = document.createElement('p');
          claveTexto.className = 'w3-small w3-text-grey';
          const etiquetaClave = document.createElement('b');
          etiquetaClave.textContent = 'Clave: ';
          claveTexto.append(etiquetaClave, document.createTextNode(clave));

          const descripcion = document.createElement('p');
          descripcion.textContent = a.descripcion || '';

          const integrantes = document.createElement('p');
          integrantes.className = 'w3-small';
          const etiquetaIntegrantes = document.createElement('b');
          etiquetaIntegrantes.textContent = 'Integrantes: ';
          integrantes.append(
            etiquetaIntegrantes,
            document.createTextNode(String((a.integrantes || []).length))
          );

          const materias = document.createElement('p');
          materias.className = 'w3-small';
          const etiquetaMaterias = document.createElement('b');
          etiquetaMaterias.textContent = 'Materias asignadas: ';
          materias.append(
            etiquetaMaterias,
            document.createTextNode((a.materiasAsignadas || []).join(', '))
          );

          const acciones = document.createElement('div');
          acciones.className = 'w3-margin-top';

          const ver = document.createElement('a');
          ver.href = `academia-detalle.html?clave=${encodeURIComponent(clave)}`;
          ver.className = 'w3-button w3-blue w3-small w3-round';
          const iconoVer = document.createElement('i');
          iconoVer.className = 'fa fa-eye';
          iconoVer.setAttribute('aria-hidden', 'true');
          ver.append(iconoVer, document.createTextNode(' Ver'));

          const editar = document.createElement('a');
          editar.href = `academia-form.html?clave=${encodeURIComponent(clave)}`;
          editar.className = 'w3-button w3-amber w3-small w3-round';
          const iconoEditar = document.createElement('i');
          iconoEditar.className = 'fa fa-pencil';
          iconoEditar.setAttribute('aria-hidden', 'true');
          editar.append(iconoEditar, document.createTextNode(' Editar'));

          const eliminar = document.createElement('button');
          eliminar.type = 'button';
          eliminar.className = 'w3-button w3-red w3-small w3-round';
          eliminar.dataset.del = clave;
          const iconoEliminar = document.createElement('i');
          iconoEliminar.className = 'fa fa-trash';
          iconoEliminar.setAttribute('aria-hidden', 'true');
          eliminar.append(iconoEliminar, document.createTextNode(' Eliminar'));

          acciones.append(ver, editar, eliminar);
          tarjeta.append(nombre, claveTexto, descripcion, integrantes, materias, acciones);
          col.appendChild(tarjeta);
          lista.appendChild(col);
        });
      } catch (error) {
        mostrarError(error.message || 'No fue posible cargar las academias.');
        return;
      }

      lista.querySelectorAll('[data-del]').forEach(b => {
        b.addEventListener('click', async () => {
          const clave = b.getAttribute('data-del');
          if (confirm(`¿Eliminar la academia ${clave}?`)) {
            msg.textContent = '';
            msg.style.display = 'none';

            try {
              const resultado = await eliminarAcademia(clave);
              if (resultado.error) throw new Error(resultado.error);
              await cargar();
            } catch (error) {
              mostrarError(error.message || 'No fue posible eliminar la academia.');
            }
          }
        });
      });
    }

    cargar();
  </script>
</body>
</html>
