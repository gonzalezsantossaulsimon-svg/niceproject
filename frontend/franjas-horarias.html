<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios disponibles</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="dashboard.html" class="w3-bar-item w3-button w3-right">Inicio</a>
    <a href="horarios.html" class="w3-bar-item w3-button w3-right">Horarios antiguos</a>
  </div>

  <main class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo">Horarios disponibles</h1>
    <a href="franja-horaria-form.html" class="w3-button w3-green w3-round w3-margin-bottom">
      <i class="fa fa-plus" aria-hidden="true"></i> Nuevo horario
    </a>

    <div class="w3-card-4 w3-white w3-padding">
      <label for="filtroDia"><b>Filtrar por día</b></label>
      <select class="w3-select w3-border w3-margin-top" id="filtroDia">
        <option value="">Todos los días</option>
        <option value="Lunes">Lunes</option>
        <option value="Martes">Martes</option>
        <option value="Miércoles">Miércoles</option>
        <option value="Jueves">Jueves</option>
        <option value="Viernes">Viernes</option>
        <option value="Sábado">Sábado</option>
      </select>
      <p class="w3-text-grey" id="contador" aria-live="polite">Cargando horarios disponibles...</p>
    </div>

    <div id="mensaje" class="w3-panel w3-pale-red w3-border w3-border-red w3-margin-top"
      role="alert" style="display:none;"></div>

    <div class="w3-responsive w3-card-4 w3-white w3-margin-top">
      <table class="w3-table-all w3-hoverable">
        <thead>
          <tr class="w3-indigo">
            <th>Día</th>
            <th>Hora inicio</th>
            <th>Hora fin</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="registros"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { inicializarCatalogoLista } from './js/catalogo-lista.js';
    inicializarCatalogoLista('franjas-horarias');
  </script>
</body>
</html>
