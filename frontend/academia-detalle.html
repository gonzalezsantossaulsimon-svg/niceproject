<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Academia</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">

  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="academias.html" class="w3-bar-item w3-button w3-right">Volver</a>
  </div>

  <div class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo" id="nombre"></h1>
    <p class="w3-text-grey"><b>Clave:</b> <span id="clave"></span></p>
    <p id="descripcion"></p>
    <div id="msg" class="w3-panel w3-pale-red w3-border w3-border-red"
      style="display:none;" role="alert"></div>

    <h3 class="w3-text-indigo w3-margin-top">Materias asignadas</h3>
    <ul id="materias" class="w3-ul w3-white w3-card-4"></ul>

    <h3 class="w3-text-indigo w3-margin-top">Integrantes</h3>
    <table class="w3-table-all w3-card-4 w3-white">
      <thead>
        <tr class="w3-indigo">
          <th>ID</th>
          <th>Nombre</th>
          <th>Especialidad</th>
          <th>Último grado</th>
          <th>Coincidencias</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script type="module">
    import { getAcademia } from './js/api.js';
    import { requiereSesion } from './js/auth.js';
    requiereSesion();

    const params = new URLSearchParams(window.location.search);
    const clave = params.get('clave');

    async function cargar() {
      const msg = document.getElementById('msg');
      try {
        const a = await getAcademia(clave);
        document.getElementById('nombre').textContent = a.nombre || '';
        document.getElementById('clave').textContent = a.clave || '';
        document.getElementById('descripcion').textContent = a.descripcion || '';

        const materiasAsignadas = Array.isArray(a.materiasAsignadas) ? a.materiasAsignadas : [];
        const ul = document.getElementById('materias');
        ul.replaceChildren();
        materiasAsignadas.forEach(materia => {
          const li = document.createElement('li');
          const icono = document.createElement('i');
          icono.className = 'fa fa-book w3-text-indigo';
          icono.setAttribute('aria-hidden', 'true');
          li.append(icono, document.createTextNode(` ${materia}`));
          ul.appendChild(li);
        });

        const tbody = document.getElementById('tbody');
        tbody.replaceChildren();
        (a.integrantesData || []).forEach(p => {
          const materiasProfe = (p.materias || []).map(m => m.nombre);
          const coincidencias = materiasAsignadas.filter(m => materiasProfe.includes(m));
          const grado = p.doctorado ? 'Doctorado' : p.maestria ? 'Maestría' : 'Licenciatura';
          const tr = document.createElement('tr');

          const id = document.createElement('td');
          id.textContent = String(p.id ?? '');
          const nombre = document.createElement('td');
          nombre.textContent = `${p.nombre || ''} ${p.apellido || ''}`.trim();
          const especialidad = document.createElement('td');
          especialidad.textContent = p.especialidad || '';
          const ultimoGrado = document.createElement('td');
          ultimoGrado.textContent = grado;
          const coincidenciasCelda = document.createElement('td');
          const coincidenciasEtiqueta = document.createElement('span');
          coincidenciasEtiqueta.className = coincidencias.length > 0
            ? 'w3-tag w3-green'
            : 'w3-tag w3-grey';
          coincidenciasEtiqueta.textContent = coincidencias.length > 0
            ? coincidencias.join(', ')
            : 'Ninguna';
          coincidenciasCelda.appendChild(coincidenciasEtiqueta);

          tr.append(id, nombre, especialidad, ultimoGrado, coincidenciasCelda);
          tbody.appendChild(tr);
        });

        msg.textContent = '';
        msg.style.display = 'none';
      } catch (error) {
        msg.textContent = error.message || 'No fue posible cargar la academia.';
        msg.style.display = 'block';
      }
    }

    cargar();
  </script>
</body>
</html>
