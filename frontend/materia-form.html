<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materia</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="materias.html" class="w3-bar-item w3-button w3-right">Volver a materias</a>
  </div>

  <main class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo" id="titulo">Nueva materia</h1>
    <div class="w3-card-4 w3-white w3-padding-16" style="max-width:800px;">
      <form id="formulario" class="w3-container" novalidate>
        <label class="w3-text-indigo" for="clave"><b>Clave *</b></label>
        <input class="w3-input w3-border" id="clave" type="text" required>

        <label class="w3-text-indigo w3-margin-top" for="nombre"><b>Nombre *</b></label>
        <input class="w3-input w3-border" id="nombre" type="text" required>

        <label class="w3-text-indigo w3-margin-top" for="academiaClave"><b>Academia</b></label>
        <select class="w3-select w3-border" id="academiaClave">
          <option value="">Cargando academias...</option>
        </select>

        <div class="w3-margin-top">
          <button type="submit" class="w3-button w3-green w3-round" id="guardar">
            <i class="fa fa-save" aria-hidden="true"></i> Guardar
          </button>
          <a href="materias.html" class="w3-button w3-grey w3-round">Cancelar</a>
        </div>

        <div id="mensaje" class="w3-panel w3-pale-red w3-border w3-border-red w3-margin-top"
          role="alert" style="display:none;"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { inicializarCatalogoFormulario } from './js/catalogo-form.js';
    inicializarCatalogoFormulario('materias');
  </script>
</body>
</html>
