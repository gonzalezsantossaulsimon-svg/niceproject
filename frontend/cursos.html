<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-indigo w3-padding">
    <span class="w3-bar-item w3-large"><i class="fa fa-graduation-cap"></i> NiceProject</span>
    <a href="dashboard.html" class="w3-bar-item w3-button w3-right">Inicio</a>
    <a href="cursos.html" class="w3-bar-item w3-button w3-right">Cursos</a>
  </div>

  <main class="w3-container w3-padding-16">
    <h1 class="w3-text-indigo">Cursos</h1>
    <a href="curso-form.html" class="w3-button w3-green w3-round w3-margin-bottom">
      <i class="fa fa-plus" aria-hidden="true"></i> Nuevo curso
    </a>

    <section class="w3-card-4 w3-white w3-padding" aria-label="Buscar cursos">
      <div class="w3-row-padding">
        <div class="w3-third">
          <label for="buscarMateria"><b>Buscar por materia</b></label>
          <input class="w3-input w3-border w3-margin-top" id="buscarMateria" type="search"
            placeholder="Materia o clave">
        </div>
        <div class="w3-third">
          <label for="buscarProfesor"><b>Buscar por profesor</b></label>
          <input class="w3-input w3-border w3-margin-top" id="buscarProfesor" type="search"
            placeholder="Nombre o número de empleado">
        </div>
        <div class="w3-third">
          <label for="buscarGrupo"><b>Buscar por grupo</b></label>
          <input class="w3-input w3-border w3-margin-top" id="buscarGrupo" type="search"
            placeholder="Grupo o clave">
        </div>
      </div>
      <p class="w3-text-grey" id="contador" aria-live="polite">Cargando cursos...</p>
    </section>

    <div id="mensaje" class="w3-panel w3-pale-red w3-border w3-border-red w3-margin-top"
      role="alert" style="display:none;"></div>

    <div class="w3-responsive w3-card-4 w3-white w3-margin-top">
      <table class="w3-table-all w3-hoverable">
        <thead>
          <tr class="w3-indigo">
            <th>Materia</th>
            <th>Profesor</th>
            <th>Grupo</th>
            <th>Salón</th>
            <th>Horario(s)</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="registros"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="./js/cursos.js"></script>
</body>
</html>
